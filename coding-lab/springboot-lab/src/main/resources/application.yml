# ==========================================================================
# 配置文件
# 面试点：Spring Boot 会按 application.properties → application.yml 的顺序找配置，
#        yml 的层级结构更适合表达"一组同一个前缀的配置"（下面 kdx 前缀就是例子）。
# ==========================================================================

server:
  port: 8080
  # 优雅停机：收到 kill 信号后不再接新请求，等正在处理的请求跑完（默认 30 秒）
  shutdown: graceful

spring:
  application:
    name: springboot-lab
  lifecycle:
    # 和上面的 graceful 配套使用
    timeout-per-shutdown-phase: 30s
  # Redis 连接超时：即使默认 profile 不用 Redis，容器里也有 StringRedisTemplate，
  # 不设超时的话 /api/infra 在 Redis 不可用时会卡住默认 60 秒。
  # 注意 YAML 不允许出现两个同名顶层 key，所以这段必须并进这一个 spring: 里面。
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s

# Actuator：只暴露 health 和 info 两个端点。
# 生产上不能开 *，否则 /actuator/env 会把配置里的密码打出来，这是真实事故来源。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# --------------------------------------------------------------------------
# 自定义配置：kdx = 模拟的金蝶云星瀚系统
# 为什么不用 @Value 一个个取？见 KdxProperties 的注释。
# --------------------------------------------------------------------------
kdx:
  base-url: http://localhost:8080/mock/kdx   # 指向本项目自带的"假金蝶"，方便自己测自己
  app-key: demo-app-key
  app-secret: demo-app-secret
  token-ttl-seconds: 300                     # 对方签发的凭证有效期（真实项目里用对方返回的 expires_in）
  token-refresh-ahead-seconds: 60            # 提前 60 秒刷新，避免"刚拿到就过期"
  connect-timeout-millis: 1000               # 建连超时：连不上就别耗着
  read-timeout-millis: 600000                  # 读超时：连上了但对方不回，必须自己设上限 10分钟

# --------------------------------------------------------------------------
# 本实验台自己的开关：memory = 进程内实现，零依赖，默认
# 真中间件版本在 application-infra.yml（--spring.profiles.active=infra 激活）
# --------------------------------------------------------------------------
lab:
  store: memory
  repository: memory
  redis-key-prefix: "oa:push:"
  dedup-ttl-seconds: 3600                    # 幂等标记过期时间：太短会重复推，太长会占内存
  stuck-minutes: 5                           # 进行中超过 5 分钟没更新，交给对账任务
  reconcile-interval-millis: 60000           # 对账任务执行间隔

# --------------------------------------------------------------------------
# 待办聚合（JUC 线程池演示）
# 启动时绑定这些参数；修改后需重启，本工程没有动态刷新。
# --------------------------------------------------------------------------
pending:
  systems: [OA, ERP, HR, FIN]      # 要聚合的上游系统
  core-pool-size: 4                # 核心线程数：4 个上游、绝大多数时间在等，先按上游数量给
  max-pool-size: 8                 # 最大线程数：允许突发，但必须有上限
  queue-capacity: 16               # 有界队列：绝不能无界，否则 maximumPoolSize 形同虚设
  keep-alive-seconds: 60           # 非核心线程空闲存活时间
  timeout-millis: 250              # 整页时间预算：超过就降级该上游
  base-url: http://localhost:8080/mock/pending   # 指向本项目自带的假上游

# 日志：把本项目的日志级别调到 DEBUG，方便看到我们自己的关键日志
logging:
  level:
    com.wufeng.lab: DEBUG
