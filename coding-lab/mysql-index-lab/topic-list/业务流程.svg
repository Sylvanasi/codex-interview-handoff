<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="760" viewBox="0 0 1060 760"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b"/></marker></defs><rect width="1060" height="760" fill="#f8fafc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#0f172a"><text x="45" y="55" font-size="28">议题列表：业务入口与SQL优化</text><text x="45" y="88" font-size="17">练习设定：仅演示列表查询，不实现审批引擎</text><rect x="45" y="120" width="970" height="88" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="65" y="152" font-size="21">1. 部门提交议题</text><text x="65" y="183" font-size="17">草稿10 → 审批中20 → 已上会30；实际状态由业务确认</text><path d="M530,209 V233" stroke="#64748b" marker-end="url(#a)"/><rect x="45" y="235" width="970" height="88" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="65" y="267" font-size="21">2. 会议管理员筛选列表</text><text x="65" y="298" font-size="17">单状态：status='20'；多状态：status IN ('20','30')</text><path d="M530,324 V348" stroke="#64748b" marker-end="url(#a)"/><rect x="45" y="350" width="970" height="88" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="65" y="382" font-size="21">3. 按发布时间倒序取20条</text><text x="65" y="413" font-size="17">ORDER BY publish_time DESC, id DESC；ID确保同时间稳定排序</text><path d="M530,439 V463" stroke="#64748b" marker-end="url(#a)"/><rect x="45" y="465" width="970" height="88" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="65" y="497" font-size="21">4. 比较索引与执行计划</text><text x="65" y="528" font-size="17">无索引 → 时间优先 → 状态优先 → 覆盖索引；IN是重要反例</text><path d="M530,554 V578" stroke="#64748b" marker-end="url(#a)"/><rect x="45" y="580" width="970" height="88" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="65" y="612" font-size="21">5. 翻下一页并选择会议议题</text><text x="65" y="643" font-size="17">携带上一页最后一条时间和ID；游标范围读取下一页</text><text x="45" y="735" font-size="17">结论看实测：多状态IN不能直接套用“等值列在前即可免排序”。</text></g></svg>