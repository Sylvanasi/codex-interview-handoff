services:
  mysql:
    image: mysql:8.0
    container_name: interview-mysql
    environment:
      MYSQL_ROOT_PASSWORD: interview123
      MYSQL_DATABASE: interview_lab
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"   # 映射到 3307，避免和你本机将来装的 MySQL 抢 3306
    volumes:
      - mysql-lab-data:/var/lib/mysql

volumes:
  mysql-lab-data:
