<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1100" height="1000" fill="#f8fafc"/><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#0f172a}.title{font-size:27px;font-weight:700}.label{font-size:20px;font-weight:600}.body{font-size:18px}.small{font-size:16px;fill:#475569}</style><text x="40" y="48" class="title">通知任务异常，如何传到 Future.get()？</text><text x="40" y="82" class="small">submit() 把任务执行结果或异常保存到 Future；get() 再读取。</text><text x="40" y="132" class="label">① 通知异常被 safeSend 捕获 → 正常返回 FAILED</text><rect x="40" y="155" width="300" height="105" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="58" y="186" class="body">工作线程：client.send()</text><text x="58" y="214" class="body">抛出 IllegalStateException</text><rect x="390" y="155" width="300" height="105" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="408" y="186" class="body">safeSend 捕获 RuntimeException</text><text x="408" y="214" class="body">返回 Outcome("FAILED")</text><rect x="740" y="155" width="320" height="105" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="758" y="186" class="body">请求线程：f.get()</text><text x="758" y="214" class="body">正常得到 FAILED 结果</text><path d="M340,207 L390,207" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M690,207 L740,207" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="55" y="292" class="small">业务失败已经转成结果，任务本身正常返回，因此没有 ExecutionException。</text><text x="40" y="350" class="label">② 异常逃出整个任务 → get() 抛 ExecutionException</text><rect x="40" y="375" width="300" height="135" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="58" y="406" class="body">工作线程：任务未正常返回</text><text x="58" y="434" class="body">例如 safeSend 外的代码异常</text><text x="58" y="462" class="body">或未捕获的 InterruptedException</text><rect x="390" y="375" width="300" height="135" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><text x="408" y="406" class="body">Future 保存异常</text><text x="408" y="434" class="body">原始异常作为 cause</text><text x="408" y="462" class="body">此时没有 Outcome 结果</text><rect x="740" y="375" width="320" height="135" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><text x="758" y="406" class="body">请求线程：f.get()</text><text x="758" y="434" class="body">抛出 ExecutionException</text><text x="758" y="462" class="body">e.getCause() 取出原始异常</text><path d="M340,440 L390,440" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M690,440 L740,440" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M900,510 L900,550" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="390" y="550" width="670" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="408" y="581" class="body">catch (ExecutionException e) {</text><text x="408" y="609" class="body">  throw new IllegalStateException("通知任务意外失败", e.getCause());</text><text x="408" y="637" class="body">}</text><text x="55" y="685" class="small">让上层知道任务异常结束，保留原因；不要吞掉异常或补一个 SUCCESS。</text><text x="40" y="745" class="label">③ 等待 get() 的请求线程被中断 → 直接抛 InterruptedException</text><rect x="40" y="770" width="460" height="100" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><text x="58" y="801" class="body">请求线程正在 f.get() 中等待</text><text x="58" y="829" class="body">另一个线程对它调用 interrupt()</text><rect x="570" y="770" width="490" height="100" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><text x="588" y="801" class="body">get() 直接抛 InterruptedException</text><text x="588" y="829" class="body">这是等待线程被中断，不是任务异常包装</text><path d="M500,820 L570,820" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="40" y="925" class="body">区分：工作线程抛 InterruptedException → ExecutionException 的 cause。</text><text x="40" y="958" class="body">          等待 get() 的线程被中断 → get() 直接抛 InterruptedException。</text></svg>