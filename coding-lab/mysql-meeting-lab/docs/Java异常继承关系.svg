<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030"><rect width="1200" height="1030" fill="#f8fafc"/><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#475569}</style><text x="35" y="45" class="title">Java 异常家族：继承关系与受检规则</text><text x="35" y="78" class="small">从上往下看：父类 → 子类。下方类型都是上方类型的一种。</text><rect x="440" y="105" width="320" height="65" rx="12" fill="#e2e8f0" stroke="#94a3b8"/><text x="456" y="134" class="head">Object：所有类的根类</text><polyline points="600,170 600,195" fill="none" stroke="#64748b" stroke-width="2"/><rect x="440" y="195" width="320" height="85" rx="12" fill="#e2e8f0" stroke="#94a3b8"/><text x="456" y="224" class="head">Throwable：可被抛出的根类</text><text x="456" y="251" class="body">throw / catch 的类型基础</text><polyline points="600,280 600,305 230,305 230,330" fill="none" stroke="#64748b" stroke-width="2"/><polyline points="600,305 820,305 820,330" fill="none" stroke="#64748b" stroke-width="2"/><rect x="35" y="330" width="390" height="155" rx="12" fill="#fee2e2" stroke="#94a3b8"/><text x="51" y="359" class="head">Error：错误【非受检】</text><text x="51" y="386" class="body">OutOfMemoryError：内存不足</text><text x="51" y="413" class="body">StackOverflowError：栈溢出</text><text x="51" y="440" class="body">通常不作为普通业务异常处理</text><rect x="580" y="330" width="470" height="90" rx="12" fill="#e2e8f0" stroke="#94a3b8"/><text x="596" y="359" class="head">Exception：异常</text><text x="596" y="386" class="body">分为受检异常与运行时异常两支</text><polyline points="820,420 820,450 365,450 365,510" fill="none" stroke="#64748b" stroke-width="2"/><polyline points="820,450 925,450 925,510" fill="none" stroke="#64748b" stroke-width="2"/><rect x="100" y="510" width="530" height="220" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="116" y="539" class="head">受检异常（Checked）</text><text x="116" y="566" class="body">IOException：输入输出异常</text><text x="116" y="593" class="body">SQLException：数据库访问异常</text><text x="116" y="620" class="body">InterruptedException：等待 / 休眠被中断</text><text x="116" y="647" class="body">ExecutionException：任务异常的包装</text><text x="116" y="674" class="body">TimeoutException：等待超时</text><rect x="680" y="510" width="490" height="220" rx="12" fill="#ffedd5" stroke="#94a3b8"/><text x="696" y="539" class="head">RuntimeException【非受检】</text><text x="696" y="566" class="body">NullPointerException：空指针</text><text x="696" y="593" class="body">IllegalArgumentException：非法参数</text><text x="696" y="620" class="body">IllegalStateException：非法状态</text><text x="696" y="647" class="body">IndexOutOfBoundsException：下标越界</text><text x="696" y="674" class="body">RejectedExecutionException：任务被拒绝</text><text x="115" y="760" class="small">注意：“受检异常”是分类名称，不是一个类。</text><rect x="35" y="795" width="1135" height="100" rx="12" fill="#ffffff" stroke="#94a3b8"/><text x="51" y="824" class="head">编译规则</text><text x="51" y="851" class="body">蓝色：必须 catch，或在方法头声明 throws。</text><text x="51" y="878" class="body">橙色、红色：编译器不强制 catch / throws，但运行时仍可能导致操作失败。</text><text x="35" y="932" class="body">catch (Exception e)：能捕获 RuntimeException 和受检 Exception，不能捕获 Error。</text><text x="35" y="964" class="body">catch (RuntimeException e)：只能捕获它及子类，不能捕获 InterruptedException。</text><text x="35" y="996" class="body">ExecutionException 的 cause 可为 InterruptedException：这是包装关系，不是继承关系。</text></svg>