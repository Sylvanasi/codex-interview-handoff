<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1230" viewBox="0 0 1160 1230"><rect width="1160" height="1230" fill="#f8fafc"/><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#475569}</style><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#64748b"/></marker></defs><text x="35" y="45" class="title">interrupt() 不会传染，也不会让每一行代码都抛异常</text><text x="35" y="80" class="small">假设 A、B 是两个线程，另一个控制线程只调用 a.interrupt()。</text><rect x="35" y="110" width="1090" height="80" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/><text x="53" y="141" class="head">控制线程：a.interrupt();</text><text x="53" y="170" class="body">意思是：给线程 A 发一个中断请求。只操作 A 的标志。</text><path d="M330,190 L330,225" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M870,190 L870,225" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="230" width="640" height="90" rx="12" fill="#fef3c7" stroke="#cbd5e1"/><text x="53" y="261" class="head">线程 A：收到请求</text><text x="53" y="290" class="body">A 的中断标志 = true</text><rect x="725" y="230" width="400" height="90" rx="12" fill="#dcfce7" stroke="#cbd5e1"/><text x="743" y="261" class="head">线程 B：没有收到请求</text><text x="743" y="290" class="body">B 的中断标志仍然 = false</text><path d="M330,320 L330,350" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="355" width="640" height="115" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="53" y="386" class="head">A 执行普通代码</text><text x="53" y="415" class="body">System.out.println("继续运行");</text><text x="53" y="444" class="body">照常执行，不会自动抛 InterruptedException。</text><rect x="725" y="355" width="400" height="115" rx="12" fill="#dcfce7" stroke="#cbd5e1"/><text x="743" y="386" class="head">B 继续执行自己的代码</text><text x="743" y="415" class="body">普通代码照常执行。</text><text x="743" y="444" class="body">sleep() 也不会因 A 被中断而失败。</text><path d="M330,470 L330,500" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="505" width="640" height="115" rx="12" fill="#fee2e2" stroke="#cbd5e1"/><text x="53" y="536" class="head">A 调用 Thread.sleep(1000)</text><text x="53" y="565" class="body">sleep 检测到 A 的标志为 true：</text><text x="53" y="594" class="body">立即抛 InterruptedException，并清成 false。</text><path d="M330,620 L330,650" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="655" width="1090" height="85" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/><text x="53" y="686" class="head">A 进入 catch (InterruptedException e)</text><text x="53" y="715" class="body">此时 A 的标志已经是 false。接下来分两种处理方式：</text><path d="M330,740 L300,775" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M800,740 L850,775" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="780" width="520" height="165" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="53" y="811" class="head">分支一：处理后决定继续</text><text x="53" y="840" class="body">catch (...) { /* 没有再次 interrupt */ }</text><text x="53" y="869" class="body">随后再次调用 sleep(1000)：</text><text x="53" y="898" class="body">正常等待，不会因为上次中断再次抛异常。</text><rect x="605" y="780" width="520" height="165" rx="12" fill="#fef3c7" stroke="#cbd5e1"/><text x="623" y="811" class="head">分支二：保留停止请求</text><text x="623" y="840" class="body">catch (...) {</text><text x="623" y="869" class="body">    Thread.currentThread().interrupt();</text><text x="623" y="898" class="body">} // A 的标志重新变成 true</text><path d="M865,945 L865,975" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="605" y="980" width="520" height="100" rx="12" fill="#fee2e2" stroke="#cbd5e1"/><text x="623" y="1011" class="head">如果 A 随后又调用 sleep(1000)</text><text x="623" y="1040" class="body">再次检测到 true → 再抛异常，并清除标志。</text><text x="45" y="1008" class="head">再次抛异常的前提：</text><text x="45" y="1043" class="body">同一个线程又被设置了中断标志，</text><text x="45" y="1076" class="body">并进入了会响应中断的等待方法。</text><rect x="35" y="1120" width="1090" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="53" y="1151" class="head">记住：标志属于每个线程自己；普通代码不会因为标志为 true 就自动停止。</text><text x="53" y="1180" class="body">恢复标志后，通常还要 return、抛异常或退出循环，结束当前操作。</text></svg>