<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1120" viewBox="0 0 1100 1120"><rect width="1100" height="1120" fill="#f8fafc"/><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#475569}</style><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#64748b"/></marker></defs><text x="35" y="46" class="title">恢复中断标志 = 把“停止提醒灯”重新点亮</text><text x="35" y="82" class="small">把线程 A 的中断标志想象成一盏灯：false 灭，true 亮。它只是提醒，不是强制停止。</text><rect x="160" y="115" width="890" height="85" rx="14" fill="#e2e8f0" stroke="#cbd5e1"/><text x="180" y="147" class="head">① 线程 A 正在等待 future.get()</text><text x="180" y="176" class="body">A 的中断标志：false（灯灭）</text><circle cx="100" cy="157" r="17" fill="#cbd5e1" stroke="#64748b"/><path d="M600,200 L600,230" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="160" y="235" width="890" height="95" rx="14" fill="#fef3c7" stroke="#cbd5e1"/><text x="180" y="267" class="head">② 另一个线程 B 调用 A.interrupt()</text><text x="180" y="296" class="body">告诉 A：“请停止当前操作。”  →  A 的标志变成 true（灯亮）</text><circle cx="100" cy="280" r="17" fill="#f59e0b" stroke="#64748b"/><path d="M600,330 L600,360" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="160" y="365" width="890" height="115" rx="14" fill="#fee2e2" stroke="#cbd5e1"/><text x="180" y="397" class="head">③ A 的 get() 检测到中断</text><text x="180" y="426" class="body">结束等待，抛出 InterruptedException 交给 catch</text><text x="180" y="455" class="body">同时清除 A 的中断标志 → false（灯又灭了）</text><circle cx="100" cy="420" r="17" fill="#cbd5e1" stroke="#64748b"/><path d="M600,480 L600,515" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><text x="35" y="548" class="head">到了 catch，接下来怎么做？</text><rect x="35" y="575" width="495" height="185" rx="14" fill="#dbeafe" stroke="#cbd5e1"/><text x="55" y="607" class="head">做法一：继续往外抛原异常</text><text x="55" y="636" class="body">catch (InterruptedException e) {</text><text x="55" y="665" class="body">    throw e;</text><text x="55" y="694" class="body">}</text><text x="55" y="723" class="body">外层直接收到异常，知道 A 被中断了。</text><rect x="565" y="575" width="500" height="185" rx="14" fill="#dcfce7" stroke="#cbd5e1"/><text x="585" y="607" class="head">做法二：不再往外抛原异常</text><text x="585" y="636" class="body">catch (InterruptedException e) {</text><text x="585" y="665" class="body">    Thread.currentThread().interrupt();</text><text x="585" y="694" class="body">    return;</text><text x="585" y="723" class="body">}</text><path d="M815,760 L815,790" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="565" y="795" width="500" height="100" rx="14" fill="#fef3c7" stroke="#cbd5e1"/><text x="585" y="827" class="head">这行代码是在操作线程 A 自己</text><text x="585" y="856" class="body">把已清除的标志重新设为 true（灯亮）</text><circle cx="530" cy="845" r="17" fill="#f59e0b" stroke="#64748b"/><text x="45" y="807" class="head">如果只 catch 然后 return：</text><text x="45" y="841" class="body">异常没有往外传，灯也灭了。</text><text x="45" y="875" class="body">后续代码就可能丢失中断信号。</text><rect x="35" y="935" width="1030" height="135" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="55" y="967" class="head">为什么留着这盏灯？</text><text x="55" y="996" class="body">后续代码可用 Thread.currentThread().isInterrupted() 检查是否需要停止。</text><text x="55" y="1025" class="body">恢复标志不会自动结束线程；当前代码仍需 return、抛异常或退出循环。</text><text x="55" y="1054" class="body">只恢复当前线程自己的中断；工作任务被中断，不要误给请求线程点灯。</text></svg>