<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="950" viewBox="0 0 1120 950"><rect width="1120" height="950" fill="#f8fafc"/><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#0f172a}.title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#475569}</style><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#64748b"/></marker></defs><text x="35" y="48" class="title">SSO登录与待办同步：两条独立链路</text><text x="35" y="84" class="small">面试复习业务设定 · 图示不是生产实现证明 · 实验结果与项目指标分开</text><rect x="65" y="115" width="990" height="105" rx="14" fill="#dbeafe" stroke="#94a3b8"/><text x="90" y="150" class="head">1. 浏览器访问OA</text><text x="90" y="190" class="body">未登录 → 302到认证端；生成并绑定state</text><path d="M560,220 L560,250" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="255" width="990" height="105" rx="14" fill="#dcfce7" stroke="#94a3b8"/><text x="90" y="290" class="head">2. 授权回调</text><text x="90" y="330" class="body">返回code与state；校验state、回调地址与有效性</text><path d="M560,360 L560,390" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="395" width="990" height="105" rx="14" fill="#fef3c7" stroke="#94a3b8"/><text x="90" y="430" class="head">3. 后端建立登录态</text><text x="90" y="470" class="body">换token → 获取身份 → 映射OA账号 → 创建本地session</text><path d="M560,500 L560,530" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="535" width="990" height="105" rx="14" fill="#ede9fe" stroke="#94a3b8"/><text x="90" y="570" class="head">4. 另一路：OA业务产生待办</text><text x="90" y="610" class="body">同步到工作台，记录映射与业务幂等标识</text><path d="M560,640 L560,670" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="675" width="990" height="105" rx="14" fill="#e2e8f0" stroke="#94a3b8"/><text x="90" y="710" class="head">5. 处理状态事件</text><text x="90" y="750" class="body">校验回调、去重、条件更新；点击跳转与审批完成方向需核实</text><text x="35" y="868" class="head">边界与追问</text><text x="35" y="903" class="small">图为复习设计；具体平台API和事件方向查源码，不把OAuth2授权直接等同于登录协议。</text></svg>