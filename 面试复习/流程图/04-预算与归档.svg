<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="950" viewBox="0 0 1120 950"><rect width="1120" height="950" fill="#f8fafc"/><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#0f172a}.title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#475569}</style><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#64748b"/></marker></defs><text x="35" y="48" class="title">预算协同与流程归档：本地事务不等于跨系统事务</text><text x="35" y="84" class="small">面试复习业务设定 · 图示不是生产实现证明 · 实验结果与项目指标分开</text><rect x="65" y="115" width="990" height="105" rx="14" fill="#dbeafe" stroke="#94a3b8"/><text x="90" y="150" class="head">1. 审批通过</text><text x="90" y="190" class="body">本地预算占用记录与远端调用需要明确事务边界</text><path d="M560,220 L560,250" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="255" width="990" height="105" rx="14" fill="#dcfce7" stroke="#94a3b8"/><text x="90" y="290" class="head">2. 判断远端结果</text><text x="90" y="330" class="body">确定成功 / 确定失败 / 超时待确认，不能一律按失败回滚</text><path d="M560,360 L560,390" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="395" width="990" height="105" rx="14" fill="#fef3c7" stroke="#94a3b8"/><text x="90" y="430" class="head">3. 驳回或废弃</text><text x="90" y="470" class="body">生成释放请求，使用业务流水关联原占用</text><path d="M560,500 L560,530" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="535" width="990" height="105" rx="14" fill="#ede9fe" stroke="#94a3b8"/><text x="90" y="570" class="head">4. 持久化补偿</text><text x="90" y="610" class="body">失败落表 → 定时认领 → 幂等重试 → 超阈值人工处理</text><path d="M560,640 L560,670" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="675" width="990" height="105" rx="14" fill="#e2e8f0" stroke="#94a3b8"/><text x="90" y="710" class="head">5. 独立归档链路</text><text x="90" y="750" class="body">流程结束 → XML生成与校验 → SFTP上传 → 按协议处理回执</text><text x="35" y="868" class="head">边界与追问</text><text x="35" y="903" class="small">普通数据库回滚不能撤销远端副作用；当前不新增SFTP demo。</text></svg>