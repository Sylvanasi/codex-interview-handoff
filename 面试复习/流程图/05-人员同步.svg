<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="950" viewBox="0 0 1120 950"><rect width="1120" height="950" fill="#f8fafc"/><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#0f172a}.title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#475569}</style><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#64748b"/></marker></defs><text x="35" y="48" class="title">组织人员同步：稳定分片、复合水位与失败重跑</text><text x="35" y="84" class="small">面试复习业务设定 · 图示不是生产实现证明 · 实验结果与项目指标分开</text><rect x="65" y="115" width="990" height="105" rx="14" fill="#dbeafe" stroke="#94a3b8"/><text x="90" y="150" class="head">1. 确定本轮范围</text><text x="90" y="190" class="body">源平台分页能力、固定上界、全量或增量模式</text><path d="M560,220 L560,250" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="255" width="990" height="105" rx="14" fill="#dcfce7" stroke="#94a3b8"/><text x="90" y="290" class="head">2. 拆分稳定分片</text><text x="90" y="330" class="body">按明确主键范围或源平台分片，记录分片标识</text><path d="M560,360 L560,390" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="395" width="990" height="105" rx="14" fill="#fef3c7" stroke="#94a3b8"/><text x="90" y="430" class="head">3. 受控并发拉取</text><text x="90" y="470" class="body">限制并发与速率；组织依赖先处理或暂存关联</text><path d="M560,500 L560,530" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="535" width="990" height="105" rx="14" fill="#ede9fe" stroke="#94a3b8"/><text x="90" y="570" class="head">4. 幂等写入与进度</text><text x="90" y="610" class="body">UPSERT / 版本校验；提交成功后记录分片进度</text><path d="M560,640 L560,670" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="675" width="990" height="105" rx="14" fill="#e2e8f0" stroke="#94a3b8"/><text x="90" y="710" class="head">5. 完成与恢复</text><text x="90" y="750" class="body">失败片单独重跑，全部覆盖后再推进全局水位</text><text x="35" y="868" class="head">边界与追问</text><text x="35" y="903" class="small">仅lastUpdateTime可能遗漏同时间数据；考虑(time,id)或重叠窗口，取决于源接口能力。</text></svg>