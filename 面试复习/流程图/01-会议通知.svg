<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="950" viewBox="0 0 1120 950"><rect width="1120" height="950" fill="#f8fafc"/><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#0f172a}.title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#475569}</style><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#64748b"/></marker></defs><text x="35" y="48" class="title">会议通知：查询、去重、并发与结果记录</text><text x="35" y="84" class="small">面试复习业务设定 · 图示不是生产实现证明 · 实验结果与项目指标分开</text><rect x="65" y="115" width="990" height="105" rx="14" fill="#dbeafe" stroke="#94a3b8"/><text x="90" y="150" class="head">1. 管理员发布会议</text><text x="90" y="190" class="body">选择议题，确定通知接收范围</text><path d="M560,220 L560,250" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="255" width="990" height="105" rx="14" fill="#dcfce7" stroke="#94a3b8"/><text x="90" y="290" class="head">2. 查询参会人</text><text x="90" y="330" class="body">meeting → meeting_topic → topic_attendee；IN分批与Set去重</text><path d="M560,360 L560,390" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="395" width="990" height="105" rx="14" fill="#fef3c7" stroke="#94a3b8"/><text x="90" y="430" class="head">3. 提交通知任务</text><text x="90" y="470" class="body">线程池接收后执行safeSend；submit拒绝则记录REJECTED</text><path d="M560,500 L560,530" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="535" width="990" height="105" rx="14" fill="#ede9fe" stroke="#94a3b8"/><text x="90" y="570" class="head">4. 收集任务结果</text><text x="90" y="610" class="body">已处理业务失败返回FAILED；逃出任务的异常由get包装</text><path d="M560,640 L560,670" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="675" width="990" height="105" rx="14" fill="#e2e8f0" stroke="#94a3b8"/><text x="90" y="710" class="head">5. 记录与补偿</text><text x="90" y="750" class="body">push_log记录结果，查FAILED重试；现有demo仅演示一次重试</text><text x="35" y="868" class="head">边界与追问</text><text x="35" y="903" class="small">业务设定基于v25。通知真实动作需明确；本地批量优劣不能由逐人sleep实验推断。</text></svg>