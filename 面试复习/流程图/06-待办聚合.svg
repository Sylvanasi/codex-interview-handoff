<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="950" viewBox="0 0 1120 950"><rect width="1120" height="950" fill="#f8fafc"/><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#0f172a}.title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#475569}</style><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#64748b"/></marker></defs><text x="35" y="48" class="title">门户待办聚合：统一预算与单系统降级</text><text x="35" y="84" class="small">面试复习业务设定 · 图示不是生产实现证明 · 实验结果与项目指标分开</text><rect x="65" y="115" width="990" height="105" rx="14" fill="#dbeafe" stroke="#94a3b8"/><text x="90" y="150" class="head">1. 门户请求进入</text><text x="90" y="190" class="body">记录统一deadline，提交阶段也消耗预算</text><path d="M560,220 L560,250" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="255" width="990" height="105" rx="14" fill="#dcfce7" stroke="#94a3b8"/><text x="90" y="290" class="head">2. 并发查询独立系统</text><text x="90" y="330" class="body">OA / ERP / HR / 财务；每个系统一个任务</text><path d="M560,360 L560,390" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="395" width="990" height="105" rx="14" fill="#fef3c7" stroke="#94a3b8"/><text x="90" y="430" class="head">3. 收集完成结果</text><text x="90" y="470" class="body">正常待办保留；失败、超时、拒绝按系统标记</text><path d="M560,500 L560,530" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="535" width="990" height="105" rx="14" fill="#ede9fe" stroke="#94a3b8"/><text x="90" y="570" class="head">4. 预算耗尽</text><text x="90" y="610" class="body">仍读取已完成任务，只取消未完成任务</text><path d="M560,640 L560,670" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="65" y="675" width="990" height="105" rx="14" fill="#e2e8f0" stroke="#94a3b8"/><text x="90" y="710" class="head">5. 返回局部结果</text><text x="90" y="750" class="body">固定系统顺序；中断清理本次任务，不关闭共享池</text><text x="35" y="868" class="head">边界与追问</text><text x="35" y="903" class="small">HTTP连接/读取超时独立配置；取消不保证阻塞调用立即停止，整体耗时需留容差。</text></svg>